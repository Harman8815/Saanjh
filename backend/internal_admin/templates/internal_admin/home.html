<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saanjh - Wedding Planning Backend</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 60px 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 40px;
            font-size: 1.1em;
        }
        
        .button {
            display: inline-block;
            padding: 15px 40px;
            margin: 10px;
            border: none;
            border-radius: 50px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
        }
        
        .admin-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        
        .admin-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }
        
        .api-button {
            background: #f8f9fa;
            color: #333;
            border: 2px solid #e9ecef;
        }
        
        .api-button:hover {
            background: #e9ecef;
            transform: translateY(-2px);
        }
        
        .info {
            margin-top: 40px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            text-align: left;
        }
        
        .info h3 {
            color: #333;
            margin-bottom: 10px;
            font-size: 1.2em;
        }
        
        .info p {
            color: #666;
            margin: 5px 0;
            font-size: 0.95em;
        }
        
        .info code {
            background: #e9ecef;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎊 Saanjh</h1>
        <p class="subtitle">Wedding Planning Backend</p>
        
        <a href="/admin/" class="button admin-button" onclick="autoFillAdmin(event)">
            🚀 Admin Panel
        </a>
        
        <a href="/api/docs/" class="button api-button">
            📡 API Documentation
        </a>
        
        <div class="info">
            <h3>🔐 Admin Credentials</h3>
            <p><strong>Username:</strong> <code>admin</code></p>
            <p><strong>Password:</strong> <code>admin123</code></p>
            <p style="margin-top: 10px; font-size: 0.85em; color: #999;">
                Click the Admin Panel button to auto-fill credentials
            </p>
        </div>
    </div>

    <script>
        function autoFillAdmin(event) {
            event.preventDefault();
            
            // Store credentials in sessionStorage
            sessionStorage.setItem('admin_username', 'admin');
            sessionStorage.setItem('admin_password', 'admin123');
            
            // Navigate to admin
            window.location.href = '/admin/';
            
            // Auto-fill after page loads
            setTimeout(() => {
                const usernameField = document.getElementById('id_username');
                const passwordField = document.getElementById('id_password');
                
                if (usernameField && passwordField) {
                    usernameField.value = sessionStorage.getItem('admin_username');
                    passwordField.value = sessionStorage.getItem('admin_password');
                    
                    // Trigger input events
                    usernameField.dispatchEvent(new Event('input', { bubbles: true }));
                    passwordField.dispatchEvent(new Event('input', { bubbles: true }));
                }
            }, 500);
        }
        
        // Auto-fill if already on admin page
        if (window.location.pathname === '/admin/') {
            window.addEventListener('load', () => {
                const usernameField = document.getElementById('id_username');
                const passwordField = document.getElementById('id_password');
                
                if (usernameField && passwordField) {
                    usernameField.value = sessionStorage.getItem('admin_username') || 'admin';
                    passwordField.value = sessionStorage.getItem('admin_password') || 'admin123';
                    
                    usernameField.dispatchEvent(new Event('input', { bubbles: true }));
                    passwordField.dispatchEvent(new Event('input', { bubbles: true }));
                }
            });
        }
    </script>
</body>
</html>
