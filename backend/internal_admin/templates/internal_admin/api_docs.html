<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saanjh API Documentation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        
        .sidebar {
            width: 280px;
            background: #1a1a2e;
            color: #eee;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #333;
            flex-shrink: 0;
        }
        
        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid #333;
            background: #16213e;
        }
        
        .sidebar-header h2 {
            font-size: 1.2em;
            margin-bottom: 5px;
        }
        
        .sidebar-header p {
            font-size: 0.85em;
            color: #888;
        }
        
        .sidebar-content {
            flex: 1;
            overflow-y: auto;
            padding: 10px 0;
        }
        
        .content-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .content-header {
            padding: 15px 20px;
            background: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .search-container {
            flex: 1;
            max-width: 400px;
        }
        
        .search-input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 0.9em;
        }
        
        .tabs {
            display: flex;
            gap: 5px;
        }
        
        .tab {
            padding: 8px 16px;
            background: #e9ecef;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9em;
            font-weight: 500;
            transition: all 0.2s;
        }
        
        .tab.active {
            background: #667eea;
            color: white;
        }
        
        .tab:hover:not(.active) {
            background: #dee2e6;
        }
        
        .content-body {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }
        
        .swagger-container {
            height: 100%;
        }
        
        .table-schemas-container {
            display: none;
            height: 100%;
        }
        
        .table-schemas-container.active {
            display: block;
        }
        
        .module-section {
            margin-bottom: 30px;
        }
        
        .module-title {
            font-size: 1.3em;
            color: #333;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }
        
        .model-card {
            background: white;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }
        
        .model-name {
            font-size: 1.1em;
            font-weight: 600;
            color: #667eea;
            margin-bottom: 10px;
        }
        
        .field-list {
            margin-top: 10px;
        }
        
        .field-item {
            display: flex;
            padding: 8px 0;
            border-bottom: 1px solid #f1f1f1;
        }
        
        .field-name {
            flex: 1;
            font-weight: 500;
            color: #333;
        }
        
        .field-type {
            flex: 1;
            color: #666;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
        }
        
        .field-relation {
            flex: 1;
            color: #999;
            font-size: 0.85em;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <h2>🎊 Saanjh API</h2>
            <p>Interactive Documentation</p>
        </div>
        <div class="sidebar-content" id="sidebarContent">
            <!-- Sidebar content will be populated by JavaScript -->
        </div>
    </div>
    
    <div class="content-area">
        <div class="content-header">
            <div class="search-container">
                <input type="text" class="search-input" id="searchInput" placeholder="Search endpoints...">
            </div>
            <div class="tabs">
                <button class="tab active" data-tab="api-docs">API Docs</button>
                <button class="tab" data-tab="table-schemas">Table Schemas</button>
            </div>
        </div>
        
        <div class="content-body">
            <div class="swagger-container" id="swaggerContainer">
                <!-- Swagger UI will be loaded here -->
            </div>
            <div class="table-schemas-container" id="tableSchemasContainer">
                <!-- Table schemas will be loaded here -->
            </div>
        </div>
    </div>

    <script>
        // Load Swagger UI dynamically
        const swaggerContainer = document.getElementById('swaggerContainer');
        swaggerContainer.innerHTML = `
            <iframe src="/api/docs/" style="width: 100%; height: 100%; border: none;" id="swaggerFrame"></iframe>
        `;
    </script>
</body>
</html>
